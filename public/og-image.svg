<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">いちわ | Xで読めるWeb漫画の第1話一覧</title>
  <desc id="desc">Web漫画の第1話リンクをX公式ポストから探せるディレクトリ</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fbf8f1" />
      <stop offset="100%" stop-color="#f2eadb" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1010" cy="-40" r="260" fill="#e64b38" opacity="0.12" />
  <circle cx="-120" cy="620" r="320" fill="#18221b" opacity="0.08" />

  <rect x="100" y="92" width="1000" height="446" rx="26" fill="#fff" stroke="#d7d1c5" stroke-width="2" />

  <g transform="translate(152 156)">
    <circle cx="36" cy="36" r="36" fill="#e64b38" />
    <text x="36" y="48" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="40" fill="#fff">一</text>
  </g>

  <text x="248" y="209" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="72" fill="#18221b" letter-spacing="3">いちわ</text>
  <text x="248" y="266" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="34" fill="#2c382f">Xで読めるWeb漫画の第1話・最新話一覧</text>
  <text x="152" y="350" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="28" fill="#4e5850">作者・作品名・公開形式で見つかる、Web漫画の入口ディレクトリ</text>

  <g transform="translate(152 402)">
    <rect width="172" height="56" rx="10" fill="#18221b" />
    <text x="86" y="36" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="24" fill="#fff">第1話リンク</text>

    <rect x="190" width="180" height="56" rx="10" fill="#e64b38" />
    <text x="280" y="36" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="24" fill="#fff">連載中作品</text>

    <rect x="388" width="206" height="56" rx="10" fill="#9dc1cd" />
    <text x="491" y="36" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="24" fill="#18221b">完結アーカイブ</text>
  </g>
</svg>
