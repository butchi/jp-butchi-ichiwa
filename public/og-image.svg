<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">いちわ | Xで読めるWeb漫画の第1話一覧</title>
  <desc id="desc">Web漫画の第1話リンクをX公式ポストから探せるディレクトリ</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fbf8f1" />
      <stop offset="100%" stop-color="#f2eadb" />
    </linearGradient>
    <linearGradient id="safe" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fffdf9" />
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)" />
  <rect x="0" y="0" width="1280" height="85" fill="#f0e8d8" opacity="0.35" />
  <rect x="0" y="715" width="1280" height="85" fill="#e9dfcd" opacity="0.4" />
  <circle cx="1080" cy="-30" r="290" fill="#e64b38" opacity="0.11" />
  <circle cx="-140" cy="790" r="340" fill="#18221b" opacity="0.08" />

  <!-- Main content is kept inside the centered 1200x630 safe area: x=40,y=85,w=1200,h=630 -->
  <rect x="80" y="120" width="1120" height="560" rx="28" fill="url(#safe)" stroke="#d7d1c5" stroke-width="2" />

  <g transform="translate(140 196)">
    <circle cx="36" cy="36" r="36" fill="#e64b38" />
    <text x="36" y="48" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="40" fill="#fff">一</text>
  </g>

  <text x="240" y="249" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="74" fill="#18221b" letter-spacing="3">いちわ</text>
  <text x="240" y="308" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="36" fill="#2c382f">Xで読めるWeb漫画の第1話・最新話一覧</text>
  <text x="140" y="400" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="29" fill="#4e5850">作者・作品名・公開形式で見つかる、Web漫画の入口ディレクトリ</text>

  <g transform="translate(140 468)">
    <rect width="186" height="60" rx="10" fill="#18221b" />
    <text x="93" y="39" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="24" fill="#fff">第1話リンク</text>

    <rect x="204" width="194" height="60" rx="10" fill="#e64b38" />
    <text x="301" y="39" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="24" fill="#fff">連載中作品</text>

    <rect x="416" width="222" height="60" rx="10" fill="#9dc1cd" />
    <text x="527" y="39" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="24" fill="#18221b">完結アーカイブ</text>
  </g>

  <text x="140" y="607" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" font-size="22" fill="#6b726c">https://ichiwa.butchi.jp/</text>
</svg>
